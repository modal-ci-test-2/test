name: Modal runner test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: modal-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running on Modal"
      - run: nproc && free -g

      # Exercises the cache sidecar: the first run misses and saves, later runs restore.
      - name: Cache test data
        id: cache
        uses: actions/cache@v4
        with:
          path: cache-test
          key: sidecar-test-v1

      - name: Create data on a miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p cache-test
          head -c 50M /dev/urandom > cache-test/blob
          date -u > cache-test/created-at
          echo "cache miss: created new data"

      - name: Show what was restored
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "cache hit: data created at $(cat cache-test/created-at)"
          ls -l cache-test

      - name: Check per-runner keys
        run: |
          rc=0
          sudo ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub || rc=1
          sudo mkdir -p /run/sshd
          sudo sshd -t && echo sshd-ok || rc=1
          sudo test -s /etc/ssl/private/ssl-cert-snakeoil.key && echo snakeoil-ok || rc=1
          grep -c generate_host_keys /usr/local/bin/modal-gha-run || { echo "old start script"; rc=1; }
          exit $rc
